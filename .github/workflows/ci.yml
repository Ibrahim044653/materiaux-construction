name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ─── Lint & TypeCheck ───────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeCheck — API
        run: pnpm --filter @materiaux/api exec npx tsc --noEmit

      - name: TypeCheck — Web
        run: pnpm --filter @materiaux/web exec npx tsc --noEmit

      - name: TypeCheck — Admin
        run: pnpm --filter @materiaux/admin exec npx tsc --noEmit

  # ─── Backend Unit Tests ─────────────────────────────────────────────────────
  test-api:
    name: Tests API (Jest)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest tests
        run: pnpm --filter @materiaux/api test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://user:password@localhost:5432/test
          JWT_ACCESS_SECRET: test-access-secret-32-chars-minimum
          JWT_REFRESH_SECRET: test-refresh-secret-32-chars-minimum

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7

  # ─── Frontend Unit Tests ────────────────────────────────────────────────────
  test-web:
    name: Tests Web (Vitest)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm --filter @materiaux/web test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 7

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @materiaux/api exec prisma generate

      - name: Build API
        run: pnpm --filter @materiaux/api build
        env:
          DATABASE_URL: postgresql://placeholder/placeholder

      - name: Build Web
        run: pnpm --filter @materiaux/web build

      - name: Build Admin
        run: pnpm --filter @materiaux/admin build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/api/dist/
            apps/web/dist/
            apps/admin/dist/
          retention-days: 7
