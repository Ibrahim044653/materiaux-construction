name: Migrate production database

# Vercel redeploie l'API a chaque push sur master. Sans migration jouee en
# meme temps, le code deploye peut attendre un schema que la base n'a pas
# encore : c'est exactement la panne survenue le 10/10/2026. Ce workflow
# applique les migrations en attente. `prisma migrate deploy` est idempotent,
# les migrations deja appliquees sont ignorees.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false # ne jamais interrompre une migration en cours

env:
  NODE_VERSION: "20"
  # La version de pnpm vient du champ `packageManager` de package.json :
  # la passer aussi a pnpm/action-setup fait echouer l'action.

jobs:
  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    # Pas d'`environment:` ici : le secret est lu au niveau du depot, ce qui
    # evite de dependre d'un environnement precis et de ses eventuels
    # relecteurs obligatoires.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check that DATABASE_URL is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL absent. A creer dans Settings > Secrets and variables > Actions > New repository secret (nom exact : DATABASE_URL)."
            exit 1
          fi
          echo "DATABASE_URL present (longueur ${#DATABASE_URL})"

      - name: Show pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @boutikpro/api exec prisma migrate status
        continue-on-error: true # informatif : sort en erreur s'il reste des migrations

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @boutikpro/api exec prisma migrate deploy
