version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: materiaux_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # Pas de port exposé en prod — accès uniquement via réseau Docker interne

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: materiaux_api
    restart: always
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - external

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: materiaux_web
    restart: always
    networks:
      - external

  nginx:
    image: nginx:alpine
    container_name: materiaux_nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
      - web
    networks:
      - external

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  postgres_data:
