version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-materiaux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-materiaux_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-materiaux}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    image: ${IMAGE_API:-materiaux-api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-materiaux}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-materiaux_prod}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      VAPID_EMAIL: ${VAPID_EMAIL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
    ports:
      - "${API_PORT:-3001}:3001"
    networks:
      - internal
      - external

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.web.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - external

  admin:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./apps/admin/dist:/usr/share/nginx/html:ro
      - ./nginx.admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${ADMIN_PORT:-3002}:80"
    networks:
      - external

volumes:
  postgres_data:

networks:
  internal:
    internal: true
  external:
